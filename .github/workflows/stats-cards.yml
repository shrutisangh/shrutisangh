name: Generate Stats Cards

on:
  schedule:
    - cron: "30 0 * * *"   # daily
  push:
    branches: [main]
    paths:
      - ".github/scripts/stats.py"
      - ".github/workflows/stats-cards.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Build stats and language cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOGIN: ${{ github.repository_owner }}
        run: python3 .github/scripts/stats.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards/
          git diff --cached --quiet || git commit -m "chore: update stats cards"
          git push
